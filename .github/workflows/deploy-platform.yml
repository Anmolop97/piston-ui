name: Deploy Platform Worker

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'worker/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'wrangler.toml'
      - '.github/workflows/deploy-platform.yml'
  workflow_dispatch:

concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build platform
        env:
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_SITE_URL: https://ui.watermelon.sh
        run: bun run build

      - name: Check analytics keys are in the build
        continue-on-error: true
        run: bun run scripts/check-analytics-build.ts

      - name: Deploy platform worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --config wrangler.toml

      - name: Notify IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: bun run scripts/indexnow.ts
